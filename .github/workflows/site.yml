# Builds the site and checks it (HTML validation + Playwright tests) on every push.
# Publishing is done by Cloudflare Workers Builds, which builds and deploys every push to main by itself.
name: Build and check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  # a newer push replaces an older check run
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cache resized photos
        uses: actions/cache@v6
        with:
          path: _site/img
          key: photos-${{ hashFiles('src/assets/photos/**', 'eleventy.config.js') }}
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          CI: true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results
          path: test-results/
